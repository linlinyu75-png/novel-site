backend:
  name: github
  repo: linlinyu75-png/novel-site
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
    - name: "posts"
    label: "小說章節"
    folder: "posts"
    create: true
    fields:
            - {label: "標題", name: "title", widget: "string"}
            - {label: "日期", name: "date", widget: "datetime"}
            - {label: "內文", name: "body", widget: "markdown"}
