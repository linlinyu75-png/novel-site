backend:
  name: github
  repo: linlinyu75-png/novel-site
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://linlinyu75-png.github.io/novel-site
display_url: https://linlinyu75-png.github.io/novel-site

collections:
    - name: "novels"
    label: "小說管理"
    files:
            - label: "全部小說"
        name: "novels"
        file: "data/novels.json"
        fields:
                    - label: "小說列表"
            name: "novels"
            widget: "list"
            fields:
                            - {label: "ID (英文數字)", name: "id", widget: "string", hint: "例如: my-novel-1"}
                            - {label: "標題", name: "title", widget: "string"}
                            - {label: "作者", name: "author", widget: "string", default: "零影"}
                            - label: "分類"
                name: "category"
                widget: "select"
                options: ["武俠", "校園", "青春", "古風", "仙俠", "同人", "現代都市", "耽美小說", "百合小說", "言情小說"]
                            - {label: "簡介", name: "summary", widget: "text"}
                            - {label: "封面圖網址", name: "cover", widget: "image", required: false}
                            - {label: "內容", name: "content", widget: "markdown"}
                            - {label: "更新日期", name: "updated", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
