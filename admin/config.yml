backend:
  name: git-gateway
  branch: main
media_folder: assets/uploads
public_folder: /assets/uploads
collections:
    - name: novels
    label: Novels
    folder: _novels
    create: true
    slug: "{{slug}}"
    fields:
            - {label: Title, name: title, widget: string}
            - {label: Author, name: author, widget: string}
    - name: chapters
    label: Chapters
    folder: _chapters
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
            - {label: Title, name: title, widget: string}
            - {label: Content, name: body, widget: markdown}
