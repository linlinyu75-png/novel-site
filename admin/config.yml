backend:
  name: github
  repo: linlinyu75-png/novel-site
  branch: main
media_folder: static/images
public_folder: /images
collections:
    - name: novels
    label: 小說
    folder: novels
    create: true
    fields:
            - {label: 標題, name: title, widget: string}
            - {label: 內文, name: body, widget: markdown}
