<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>零影小說站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Noto Sans TC", sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 20px;
      line-height: 1.8;
    }
   .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin: 20px 0 40px; color: #fff; cursor: pointer; }
   .book {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid #3a3a3a;
    }
   .book-title { font-size: 28px; margin-bottom: 8px; color: #fff; }
   .book-meta { color: #999; font-size: 14px; margin-bottom: 16px; }
   .book-desc { margin-bottom: 20px; color: #ccc; }
   .book-cover { max-width: 200px; border-radius: 4px; margin-bottom: 16px; }
   .chapter-list { list-style: none; }
   .chapter-list li {
      padding: 12px 0;
      border-bottom: 1px solid #3a3a3a;
      cursor: pointer;
    }
   .chapter-list li:last-child { border-bottom: none; }
   .chapter-list li:hover { background: #333; margin: 0 -24px; padding: 12px 24px; }
   .chapter-title { color: #7dd3fc; font-size: 16px; }
   .chapter-order { color: #666; margin-right: 8px; font-size: 14px; }
   .reader {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 24px;
      border: 1px solid #3a3a3a;
    }
   .reader h2 { margin-bottom: 20px; color: #fff; }
   .reader-content { white-space: pre-wrap; color: #ddd; }
   .reader-content img { max-width: 100%; border-radius: 4px; margin: 16px 0; }
   .back-btn {
      color: #7dd3fc;
      margin-bottom: 20px;
      display: inline-block;
      cursor: pointer;
    }
   .back-btn:hover { color: #fff; }
   .loading { text-align: center; color: #666; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 onclick="showHome()">零影小說站</h1>
    <div id="app"><div class="loading">載入中...</div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    let allPosts = [];
    let allBooks = {};

    async function loadNovels() {
      const repo = 'linlinyu75-png/novel-site';
      const api = `https://api.github.com/repos/${repo}/contents/novels`;

      try {
        const res = await fetch(api);
        const files = await res.json();

        const posts = await Promise.all(
          files.filter(f => f.name.endsWith('.md')).map(async file => {
            const content = await fetch(file.download_url).then(r => r.text());
            const match = content.match(/---\n([\s\S]*?)\n---\n([\s\S]*)/);
            if (!match) return null;

            const fm = {};
            match[1].split('\n').forEach(line => {
              const [key,...rest] = line.split(':');
              fm[key.trim()] = rest.join(':').trim().replace(/^['"]|['"]$/g, '');
            });

            return {
             ...fm,
              body: match[2].trim(),
              slug: file.name.replace('.md', '')
            };
          })
        );

        allPosts = posts.filter(p => p);

        // 按書分組
        allBooks = {};
        allPosts.forEach(post => {
          const bookTitle = post.book_title || '未命名';
          if (!allBooks[bookTitle]) {
            allBooks[bookTitle] = {
              title: bookTitle,
              author: post.author,
              description: post.book_description,
              cover: post.cover,
              chapters: []
            };
          }
          allBooks[bookTitle].chapters.push(post);
        });

        Object.values(allBooks).forEach(book => {
          book.chapters.sort((a, b) => (parseInt(a.chapter_order) || 0) - (parseInt(b.chapter_order) || 0));
        });

        showHome();
      } catch (e) {
        document.getElementById('app').innerHTML = '<p class="loading">載入失敗，請重整</p>';
      }
    }

    function showHome() {
      const html = Object.values(allBooks).map(book => `
        <div class="book">
          ${book.cover? `<img src="${book.cover}" class="book-cover">` : ''}
          <h2 class="book-title">《${book.title}》</h2>
          <div class="book-meta">作者：${book.author || '零影'}</div>
          ${book.description? `<div class="book-desc">${book.description}</div>` : ''}
          <ul class="chapter-list">
            ${book.chapters.map(ch => `
              <li onclick="showChapter('${ch.slug}')">
                <span class="chapter-order">${ch.chapter_order || ''}</span>
                <span class="chapter-title">${ch.title}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');

      document.getElementById('app').innerHTML = html || '<p class="loading">還沒有小說，快去後台發文吧！</p>';
    }

    function showChapter(slug) {
      const post = allPosts.find(p => p.slug === slug);
      if (!post) return;

      const html = `
        <div class="reader">
          <div class="back-btn" onclick="showHome()">← 返回目錄</div>
          <h2>${post.title}</h2>
          <div class="reader-content">${marked.parse(post.body)}</div>
        </div>
      `;
      document.getElementById('app').innerHTML = html;
      window.scrollTo(0, 0);
    }

    loadNovels();
  </script>
</body>
</html>
