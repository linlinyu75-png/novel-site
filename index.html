<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林林小說站</title>
<style>
:root{--bg:#fafafa;--card:#fff;--text:#1a1a1a;--text-secondary:#666;--primary:#6b5b95;--border:#e5e5e5;--tag:#f0f0f0}
[data-theme="dark"]{--bg:#1a1a1a;--card:#2a2a2a;--text:#e5e5e5;--text-secondary:#aaa;--primary:#9d8dcf;--border:#3a3a3a;--tag:#333}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.header-top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-size:24px;font-weight:700;color:var(--primary)}
.btn{padding:8px 16px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer}
.btn:hover{background:var(--tag)}
.search{width:100%;padding:12px;margin:12px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.categories{display:flex;gap:8px;padding:12px 0;overflow-x:auto}
.category-btn{padding:6px 14px;border:1px solid var(--border);background:var(--card);border-radius:20px;cursor:pointer;white-space:nowrap}
.category-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.novel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:24px 0}
.novel-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer}
.novel-card:hover{transform:translateY(-4px)}
.novel-cover{width:100%;height:200px;background:linear-gradient(135deg,var(--primary),#a891d9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px}
.novel-info{padding:16px}
.novel-title{font-size:18px;font-weight:600;margin-bottom:4px}
.novel-author{color:var(--text-secondary);font-size:14px;margin-bottom:8px}
.novel-summary{color:var(--text-secondary);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.novel-tag{display:inline-block;margin-top:12px;padding:4px 10px;background:var(--tag);border-radius:6px;font-size:12px}
.page{display:none}.page.active{display:block}
.detail-header{padding:32px 0;display:flex;gap:24px}
.detail-cover{width:200px;height:280px;border-radius:12px;flex-shrink:0}
.chapter-list{background:var(--card);border:1px solid var(--border);border-radius:12px}
.chapter-item{padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between}
.chapter-item:last-child{border-bottom:none}
.chapter-item:hover{background:var(--tag)}
.reading-content{max-width:800px;margin:0 auto;padding:40px 20px;font-size:18px;line-height:1.8}
.reading-toolbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
@media(max-width:768px){.detail-header{flex-direction:column}.detail-cover{width:100%;height:200px}}
</style>
</head>
<body>
<header><div class="container"><div class="header-top"><div class="logo">林林小說站</div><div><button class="btn" id="themeToggle">深色</button></div></div></div></header>
<main class="container">
<div id="homePage" class="page active">
<input type="text" class="search" id="searchInput" placeholder="搜尋書名、作者...">
<div class="categories" id="categoryBar"></div>
<div class="novel-grid" id="novelGrid"></div>
</div>
<div id="detailPage" class="page">
<button class="btn" onclick="showPage('homePage')">← 返回</button>
<div class="detail-header" id="detailHeader"></div>
<h3 style="margin:24px 0 12px">章節列表</h3>
<div class="chapter-list" id="chapterList"></div>
</div>
<div id="readingPage" class="page">
<button class="btn" onclick="backToDetail()">← 返回章節</button>
<div class="reading-content" id="readingContent"></div>
<div class="reading-toolbar">
<button class="btn" onclick="changeFontSize(-1)">A-</button>
<button class="btn" onclick="changeFontSize(1)">A+</button>
<button class="btn" onclick="prevChapter()">上一章</button>
<button class="btn" onclick="nextChapter()">下一章</button>
</div>
</div>
</main>
<script>
const CATEGORIES=['全部','武俠','校園','青春','古風','仙俠','同人','現代都市','耽美小說','百合小說','言情小說'];
const novels=[
{id:1,title:"劍破九重天",author:"墨白",category:"武俠",summary:"少年仗劍走天涯，一劍光寒十九州。",cover:"⚔️"},
{id:2,title:"窗邊的你",author:"夏目",category:"校園",summary:"高三那年，窗邊的轉學生改變了我。",cover:"🏫"},
{id:3,title:"十八歲的夏天",author:"林小樹",category:"青春",summary:"蟬鳴、冰可樂、沒說出口的喜歡。",cover:"☀️"},
{id:4,title:"長安十二時辰記",author:"蘇青",category:"古風",summary:"上元燈節，長安暗流湧動。",cover:"🏮"},
{id:5,title:"問鼎仙途",author:"道一",category:"仙俠",summary:"凡人修仙，逆天改命。",cover:"⛰️"},
{id:6,title:"提瓦特日常",author:"旅行者",category:"同人",summary:"穿越提瓦特的社畜生活。",cover:"✨"},
{id:7,title:"三十歲的合租",author:"陳述",category:"現代都市",summary:"北漂十年，互相取暖的日子。",cover:"🏙️"},
{id:8,title:"竹馬成雙",author:"青竹",category:"耽美小說",summary:"一起長大，什麼時候變了味道？",cover:"🎋"},
{id:9,title:"花店二樓",author:"晚風",category:"百合小說",summary:"花店二樓住進神秘畫家。",cover:"💐"},
{id:10,title:"南風知我意",author:"溫言",category:"言情小說",summary:"家族聯姻，他等了她十年。",cover:"🌸"},
];
const chapters={1:[{title:"第一章 初入江湖",content:"暮春三月，江南草長。\n\n蘇州城外，少年背著木劍獨行..."}]};
let currentCategory='全部',currentNovel=null,currentChapter=0,fontSize=18;
function init(){renderCategories();renderNovels();loadTheme()}
function renderCategories(){document.getElementById('categoryBar').innerHTML=CATEGORIES.map(c=>`<button class="category-btn ${c===currentCategory?'active':''}" onclick="filterCategory('${c}')">${c}</button>`).join('')}
function filterCategory(c){currentCategory=c;renderCategories();renderNovels()}
function renderNovels(){const s=document.getElementById('searchInput').value.toLowerCase();const g=document.getElementById('novelGrid');let f=novels.filter(n=>(currentCategory==='全部'||n.category===currentCategory)&&(n.title.toLowerCase().includes(s)||n.author.toLowerCase().includes(s)));g.innerHTML=f.map(n=>`<div class="novel-card" onclick="showDetail(${n.id})"><div class="novel-cover">${n.cover}</div><div class="novel-info"><div class="novel-title">${n.title}</div><div class="novel-author">${n.author}</div><div class="novel-summary">${n.summary}</div><span class="novel-tag">${n.category}</span></div></div>`).join('')}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
function showDetail(id){currentNovel=novels.find(n=>n.id===id);const ch=chapters[id]||[{title:"第一章",content:"範例內容"}];document.getElementById('detailHeader').innerHTML=`<div class="novel-cover detail-cover">${currentNovel.cover}</div><div><h1>${currentNovel.title}</h1><p style="color:var(--text-secondary);margin:8px 0">作者：${currentNovel.author}</p><span class="novel-tag">${currentNovel.category}</span><p style="margin-top:16px">${currentNovel.summary}</p></div>`;document.getElementById('chapterList').innerHTML=ch.map((c,i)=>`<div class="chapter-item" onclick="readChapter(${i})"><span>${c.title}</span><span>→</span></div>`).join('');showPage('detailPage')}
function readChapter(i){currentChapter=i;const ch=(chapters[currentNovel.id]||[])[i];document.getElementById('readingContent').innerHTML=`<h2 style="text-align:center;margin-bottom:32px">${ch.title}</h2><div style="white-space:pre-wrap">${ch.content}</div>`;localStorage.setItem(`progress_${currentNovel.id}`,i);showPage('readingPage')}
function backToDetail(){showPage('detailPage')}
function prevChapter(){if(currentChapter>0)readChapter(currentChapter-1)}
function nextChapter(){const ch=chapters[currentNovel.id]||[];if(currentChapter<ch.length-1)readChapter(currentChapter+1)}
function changeFontSize(d){fontSize=Math.max(14,Math.min(24,fontSize+d));document.getElementById('readingContent').style.fontSize=fontSize+'px'}
function loadTheme(){const t=localStorage.getItem('theme')||'light';document.body.setAttribute('data-theme',t);document.getElementById('themeToggle').textContent=t==='dark'?'淺色':'深色'}
document.getElementById('themeToggle').onclick=()=>{const c=document.body.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.body.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.getElementById('themeToggle').textContent=n==='dark'?'淺色':'深色'};
document.getElementById('searchInput').oninput=renderNovels;init();
</script>
</body>
</html>
