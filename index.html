<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的小說站</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.8; }
    h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
   .post { margin: 30px 0; }
   .post a { font-size: 22px; color: #333; text-decoration: none; }
   .post a:hover { color: #0070f3; }
   .date { color: #999; font-size: 14px; }
   .admin { position: fixed; bottom: 20px; right: 20px; background: #000; color: #fff; padding: 10px 15px; border-radius: 20px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>我的小說</h1>
  <div id="posts">讀取中...</div>
  <a href="/admin/" class="admin">寫文章</a>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const repo = 'linlinyu75-png/novel-site';
    const folder = 'novels';
    
    fetch(`https://api.github.com/repos/${repo}/contents/${folder}`)
   .then(res => res.json())
   .then(files => {
        const postsDiv = document.getElementById('posts');
        postsDiv.innerHTML = '';
        if (!Array.isArray(files)) {
          postsDiv.innerHTML = '還沒發文，點右下角寫第一篇';
          return;
        }
        files.reverse().forEach(file => {
          if (file.name.endsWith('.md')) {
            fetch(file.download_url)
           .then(res => res.text())
           .then(md => {
                const title = md.match(/title:\s*(.*)/)?.[1] || file.name;
                const date = new Date(file.name.split('-').slice(0,3).join('-')).toLocaleDateString();
                const slug = file.name.replace('.md', '');
                
                const postEl = document.createElement('div');
                postEl.className = 'post';
                postEl.innerHTML = `
                  <a href="post.html?file=${slug}">${title}</a>
                  <div class="date">${date}</div>
                `;
                postsDiv.appendChild(postEl);
              });
          }
        });
        if (files.length === 0) postsDiv.innerHTML = '還沒發文，點右下角寫第一篇';
      }).catch(() => {
        document.getElementById('posts').innerHTML = '還沒發文，點右下角寫第一篇';
      });
  </script>
</body>
</html>
