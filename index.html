<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>零影小說站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, "Noto Sans TC", sans-serif; 
      background: #1a1a1a; 
      color: #e0e0e0; 
      padding: 20px;
      line-height: 1.8;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 40px; color: #fff; }
    .book { 
      background: #2a2a2a; 
      border-radius: 8px; 
      padding: 24px; 
      margin-bottom: 30px;
      border: 1px solid #3a3a3a;
    }
    .book-title { font-size: 28px; margin-bottom: 8px; color: #fff; }
    .book-meta { color: #999; font-size: 14px; margin-bottom: 16px; }
    .book-desc { margin-bottom: 20px; color: #ccc; }
    .chapter-list { list-style: none; }
    .chapter-list li { 
      padding: 12px 0; 
      border-bottom: 1px solid #3a3a3a; 
    }
    .chapter-list li:last-child { border-bottom: none; }
    .chapter-list a { 
      color: #7dd3fc; 
      text-decoration: none; 
      font-size: 16px;
    }
    .chapter-list a:hover { color: #fff; }
    .chapter-order { 
      color: #666; 
      margin-right: 8px; 
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>零影小說站</h1>
    <div id="books"></div>
  </div>

  <script>
    async function loadNovels() {
      const repo = 'linlinyu75-png/novel-site';
      const api = `https://api.github.com/repos/${repo}/contents/novels`;
      
      try {
        const res = await fetch(api);
        const files = await res.json();
        
        const posts = await Promise.all(
          files.filter(f => f.name.endsWith('.md')).map(async file => {
            const content = await fetch(file.download_url).then(r => r.text());
            const match = content.match(/---\n([\s\S]*?)\n---\n([\s\S]*)/);
            if (!match) return null;
            
            const frontmatter = {};
            match[1].split('\n').forEach(line => {
              const [key, ...rest] = line.split(':');
              frontmatter[key.trim()] = rest.join(':').trim();
            });
            
            return {
              ...frontmatter,
              body: match[2].trim(),
              slug: file.name.replace('.md', '')
            };
          })
        );
        
        // 按書名分組
        const books = {};
        posts.filter(p => p).forEach(post => {
          const bookTitle = post.book_title || '未命名';
          if (!books[bookTitle]) {
            books[bookTitle] = {
              title: bookTitle,
              author: post.author,
              description: post.book_description,
              cover: post.cover,
              chapters: []
            };
          }
          books[bookTitle].chapters.push(post);
        });
        
        // 排序章節
        Object.values(books).forEach(book => {
          book.chapters.sort((a, b) => (a.chapter_order || 0) - (b.chapter_order || 0));
        });
        
        renderBooks(books);
      } catch (e) {
        document.getElementById('books').innerHTML = '<p>載入失敗，請重整</p>';
      }
    }
    
    function renderBooks(books) {
      const html = Object.values(books).map(book => `
        <div class="book">
          <h2 class="book-title">《${book.title}》</h2>
          <div class="book-meta">作者：${book.author || '零影'}</div>
          ${book.description ? `<div class="book-desc">${book.description}</div>` : ''}
          <ul class="chapter-list">
            ${book.chapters.map(ch => `
              <li>
                <span class="chapter-order">${ch.chapter_order || ''}</span>
                <a href="/novels/${ch.slug}.html">${ch.title}</a>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');
      
      document.getElementById('books').innerHTML = html || '<p>還沒有小說，快去後台發文吧！</p>';
    }
    
    loadNovels();
  </script>
</body>
</html>
