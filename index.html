<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>零影小說站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Noto Sans TC", sans-serif;
      background: #e8f5e9;
      color: #1b5e20;
      padding: 20px;
      line-height: 1.8;
    }
 .container { max-width: 800px; margin: 0 auto; }
    h1 {
      text-align: center;
      margin: 20px 0 40px;
      color: #2e7d32;
      cursor: pointer;
      font-size: 32px;
    }
  /* 書本卡片 - 主頁 */
 .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
 .book-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      border: 2px solid #a5d6a7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: all 0.2s;
    }
 .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border-color: #66bb6a;
    }
 .book-cover {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #f1f8e9;
    }
 .book-title { font-size: 20px; color: #1b5e20; margin-bottom: 6px; }
 .book-meta { color: #388e3c; font-size: 14px; }
 .book-desc-card { 
      color: #2e7d32; 
      font-size: 14px; 
      margin-top: 8px; 
      display: -webkit-box; 
      -webkit-line-clamp: 3; 
      -webkit-box-orient: vertical; 
      overflow: hidden; 
    }

  /* 書本詳情頁 - 點進去的目錄頁 */
 .book-detail {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      border: 2px solid #a5d6a7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
 .book-detail-header {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
 .book-detail-cover {
      width: 180px;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #c8e6c9;
      flex-shrink: 0;
    }
