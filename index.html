<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>零影小說站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Noto Sans TC", sans-serif;
      background: #e8f5e9;
      color: #1b5e20;
      padding: 20px;
      line-height: 1.8;
    }
.container { max-width: 800px; margin: 0 auto; }
    h1 {
      text-align: center;
      margin: 20px 0 40px;
      color: #2e7d32;
      cursor: pointer;
      font-size: 32px;
    }
.book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
.book-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      border: 2px solid #a5d6a7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: all 0.2s;
    }
.book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border-color: #66bb6a;
    }
.book-cover {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #f1f8e9;
    }
.book-title { font-size: 20px; color: #1b5e20; margin-bottom: 6px; }
.book-meta { color: #388e3c; font-size: 14px; }
.book-desc-card {
      color: #2e7d32;
      font-size: 14px;
      margin-top: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
.book-detail {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      border: 2px solid #a5d6a7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
.book-detail-header {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
.book-detail-cover {
      width: 180px;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #c8e6c9;
      flex-shrink: 0;
    }
.book-detail-info { flex: 1; min-width: 200px; }
.book-detail-title { font-size: 28px; margin-bottom: 8px; color: #1b5e20; }
.book-detail-meta { color: #388e3c; font-size: 15px; margin-bottom: 16px; }
.book-detail-desc {
      color: #2e7d32;
      font-size: 16px;
      line-height: 1.9;
      white-space: pre-wrap;
    }
.chapter-list { list-style: none; clear: both; margin-top: 20px; }
.chapter-list-title {
      font-size: 18px;
      color: #2e7d32;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #a5d6a7;
    }
.chapter-list li {
      padding: 14px 16px;
      border-bottom: 1px solid #c8e6c9;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 4px;
    }
.chapter-list li:hover { background: #f1f8e9; }
.chapter-title { color: #2e7d32; font-size: 16px; font-weight: 500; }
.chapter-order { color: #66bb6a; margin-right: 8px; font-size: 14px; }
.reader {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      border: 2px solid #a5d6a7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
.reader h2 { margin-bottom: 20px; color: #1b5e20; }
.reader-content { white-space: pre-wrap; color: #2e7d32; font-size: 17px; }
.reader-content img { max-width: 100%; border-radius: 8px; margin: 16px 0; }
.back-btn {
      color: #388e3c;
      margin-bottom: 20px;
      display: inline-block;
      cursor: pointer;
      font-weight: 500;
    }
.back-btn:hover { color: #1b5e20; }
.loading { text-align: center; color: #66bb6a; padding: 40px; }
.error { background: #fff; border: 2px solid #ef5350; padding: 20px; border-radius: 8px; color: #c62828; }
  @media (max-width: 600px) {
 .book-grid { grid-template-columns: 1fr; }
 .book-detail-header { flex-direction: column; }
 .book-detail-cover { width: 100%; height: auto; max-width: 200px; margin: 0 auto; }
  }
  </style>
</head>
<body>
  <div class="container">
    <h1 onclick="showHome()">零影小說站</h1>
    <div id="app"><div class="loading">載入中...</div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    let allPosts = [];
    let allBooks = {};

    async function loadNovels() {
      const repo = 'linlinyu75-png/novel-site';
      const api = `https://api.github.com/repos/${repo}/contents/novels`;
      try {
        const res = await fetch(api);
        if (!res.ok) throw new Error(`GitHub API 錯誤: ${res.status}`);
        const files = await res.json();
        if (!Array.isArray(files)) throw new Error('novels 資料夾是空的');

        const mdFiles = files.filter(f => f.name.endsWith('.md'));
        if (mdFiles.length === 0) throw new Error('novels 資料夾裡沒有.md 檔案');

        const posts = await Promise.all(
          mdFiles.map(async file => {
            const content = await fetch(file.download_url).then(r => r.text());
            const match = content.match(/---\n([\s\S]*?)\n---\n([\s\S]*)/);
            if (!match) return null;
            const fm = {};
            match[1].split('\n').forEach(line => {
              const [key,...rest] = line.split(':');
              if (key) fm[key.trim()] = rest.join(':').trim().replace(/^['"]|['"]$/g, '');
            });
            return {...fm, body: match[2].trim(), slug: file.name.replace('.md', '') };
          })
        );
        allPosts = posts.filter(p => p);
        if (allPosts.length === 0) throw new Error('所有.md 檔案都解析失敗');

        allBooks = {};
        allPosts.forEach(post => {
          const bookTitle = post.book_title || '未命名';
          if (!allBooks[bookTitle]) {
            allBooks[bookTitle] = {
              title: bookTitle,
              author: post.author,
              description: post.book_description,
              cover: post.cover || 'https://i.imgur.com/Yt6W1gh.png',
              chapters: []
            };
          }
          allBooks[bookTitle].chapters.push(post);
        });
        Object.values(allBooks).forEach(book => {
          book.chapters.sort((a, b) => (parseInt(a.chapter_order) || 0) - (parseInt(b.chapter_order) || 0));
        });
        showHome();
      } catch (e) {
        document.getElementById('app').innerHTML = `
          <div class="error">
            <strong>載入失敗了 😭</strong><br>
            原因：${e.message}<br><br>
            <strong>檢查清單：</strong><br>
            1. 去後台 https://novel-site-zeta.vercel.app/admin/ 發一篇文<br>
            2. 確認 novels 資料夾有.md 檔案<br>
            3. 重整頁面試試
          </div>
        `;
      }
    }

    function showHome() {
      if (Object.keys(allBooks).length === 0) {
        document.getElementById('app').innerHTML = '<p class="loading">還沒有小說，快去後台發文吧！</p>';
        return;
      }
      const html = `
        <div class="book-grid">
          ${Object.values(allBooks).map(book => `
            <div class="book-card" onclick="showBook('${book.title.replace(/'/g, "\\'")}')">
              <img src="${book.cover}" class="book-cover" onerror="this.src='https://i.imgur.com/Yt6W1gh.png'">
              <h2 class="book-title">《${book.title}》</h2>
              <div class="book-meta">作者：${book.author || '零影'}</div>
              ${book.description? `<div class="book-desc-card">${book.description}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('app').innerHTML = html;
      window.scrollTo(0, 0);
    }

    function showBook(bookTitle) {
      const book = allBooks[bookTitle];
      if (!book) return;
      const html = `
        <div class="book-detail">
          <div class="back-btn" onclick="showHome()">← 返回書櫃</div>
          <div class="book-detail-header">
            <img src="${book.cover}" class="book-detail-cover" onerror="this.src='https://i.imgur.com/Yt6W1gh.png'">
            <div class="book-detail-info">
              <h2 class="book-detail-title">《${book.title}》</h2>
              <div class="book-detail-meta">作者：${book.author || '零影'}　共 ${book.chapters.length} 章</div>
              ${book.description? `<div class="book-detail-desc">${book.description}</div>` : '<div class="book-detail-desc" style="color:#999;">作者還沒寫簡介...</div>'}
            </div>
          </div>
          <div class="chapter-list-title">章節目錄</div>
          <ul class="chapter-list">
            ${book.chapters.map(ch => `
              <li onclick="showChapter('${ch.slug}')">
                <span class="chapter-order">${ch.chapter_order || ''}</span>
                <span class="chapter-title">${ch.title}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
      document.getElementById('app').innerHTML = html;
      window.scrollTo(0, 0);
    }

    function showChapter(slug) {
      const post = allPosts.find(p => p.slug === slug);
      if (!post) return;
      const html = `
        <div class="reader">
          <div class="back-btn" onclick="showBook('${post.book_title.replace(/'/g, "\\'")}')">← 返回目錄</div>
          <h2>${post.title}</h2>
          <div class="reader-content">${marked.parse(post.body)}</div>
        </div>
      `;
      document.getElementById('app').innerHTML = html;
      window.scrollTo(0, 0);
    }
    loadNovels();
  </script>
</body>
</html>
